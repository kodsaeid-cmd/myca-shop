const fa=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

function toast(m){document.querySelector('.toast')?.remove();let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);clearTimeout(toastHandle);toastHandle=setTimeout(()=>x.remove(),2800)}

const catBy=id=>state.categories.find(c=>c.id===id);
const prodBy=id=>state.products.find(p=>p.id===id);
function descendant(p,ancestor){let cur=catBy(p.category);let n=0;while(cur&&n++<20){if(cur.id===ancestor)return true;cur=catBy(cur.parent)}return false}
const catName=id=>catBy(id)?.name||'بدون دسته';
function mediaTile(entity,size='normal'){let src=safeSrc(entity?.image);return src?`<img src="${src}" alt="${esc(entity.name||entity.title||'تصویر')}" loading="lazy">`:`<span>${esc(entity?.emoji||'📦')}</span>`}
function productCard(p){let discounted=Number(p.comparePrice)>Number(p.price);return `<article class="product"><div class="prod-img" onclick="go('product:${esc(p.id)}')">${mediaTile(p)}${discounted?'<span class="pill gold" style="position:absolute;right:10px;top:10px;font-size:10px">تخفیف</span>':''}</div><div class="prod-info"><div class="xs muted">${esc(catName(p.category))}</div><h3 onclick="go('product:${esc(p.id)}')" style="cursor:pointer">${esc(p.name)}</h3><div>${discounted?`<span class="old">${money(p.comparePrice)}</span>`:''}<div class="price">${money(p.price)}</div></div><div class="prodfoot"><span class="sm muted">${p.stock>0?'موجود':'ناموجود'}</span><button class="btn sm" ${p.stock<=0?'disabled':''} onclick="addCart('${esc(p.id)}')">افزودن +</button></div></div></article>`}
const visibleProducts=()=>state.products.filter(p=>p.published && p.stock>=0);
function icon(name){const icons={bag:'<path d="M5 8h14l-1.1 12H6.1L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.2-6.8 7.5-6.8s7.5 2.8 7.5 6.8"/>',settings:'<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2M18.4 5.6l-2.2 2.2m-8.4 8.4-2.2 2.2"/><circle cx="12" cy="12" r="3.3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',shield:'<path d="m12 2 9 4v6c0 5-3.8 8-9 10C6.8 20 3 17 3 12V6Z"/><path d="m8.5 12 2.3 2.3 4.8-4.8"/>',truck:'<path d="M2 6h13v11H2z M15 10h4l3 4v3h-7"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>',chat:'<path d="M21 11c0 5.2-4.1 9-9 9-1.7 0-3.1-.3-4.4-1L3 20l1.4-4C3.5 14.6 3 12.8 3 11c0-5.1 4.1-9 9-9s9 3.9 9 9Z"/>',heart:'<path d="M20.8 4.6a5.7 5.7 0 0 0-8.1 0l-.7.7-.7-.7a5.7 5.7 0 1 0-8.1 8.1L12 22l8.8-9.3a5.7 5.7 0 0 0 0-8.1Z"/>'};return `<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[name]||icons.heart}</svg>`}

function catalog(){let filtered=visibleProducts().filter(p=>(filterCategory==='all'||descendant(p,filterCategory))&&(!searchTerm||[p.name,p.description,p.sku,catName(p.category)].join(' ').includes(searchTerm)));return `<main class="container"><div class="page-head"><h1>محصولات فروشگاه</h1><p>یافتن کالای مناسب برای نیاز خانواده</p></div><div class="card" style="margin-bottom:22px"><div class="row"><input class="search" style="max-width:420px;flex:1" value="${esc(searchTerm)}" oninput="searchTerm=this.value;renderCatalogOnly()" placeholder="نام کالا، برند یا کد محصول..."><button class="btn secondary sm" onclick="filterCategory='all';searchTerm='';render()">حذف فیلترها</button></div><div class="chiprow" style="margin-top:15px"><button class="chip ${filterCategory==='all'?'selected':''}" onclick="filterCategory='all';render()">همه</button>${state.categories.filter(c=>c.active).sort((a,b)=>a.order-b.order).map(c=>`<button class="chip ${filterCategory===c.id?'selected':''}" onclick="filterCategory='${esc(c.id)}';render()">${esc(c.name)}</button>`).join('')}</div></div><div id="catalog-results">${filtered.length?`<div class="products">${filtered.map(productCard).join('')}</div>`:'<div class="empty">محصولی با این شرایط پیدا نشد.</div>'}</div></main>`}

function productDetail(id){let p=prodBy(id);if(!p||!p.published)return '<div class="container empty">کالا یافت نشد.</div>';let gallery=String(p.gallery||'').split(',').map(s=>s.trim()).filter(Boolean);return `<main class="container"><div class="page-head sm muted"><button class="ghost" onclick="go('catalog')">فروشگاه</button> / ${esc(catName(p.category))} / ${esc(p.name)}</div><div class="productdetail"><div><div class="large-image">${mediaTile(p)}</div>${gallery.length?`<div class="row" style="margin-top:10px">${gallery.map(u=>`<img src="${safeSrc(u)}" style="width:75px;height:75px;object-fit:contain;border:1px solid var(--border);border-radius:10px">`).join('')}</div>`:''}</div><div class="card"><span class="pill">${esc(catName(p.category))}</span><h1 style="font-size:25px;margin-top:15px">${esc(p.name)}</h1><p class="muted">${esc(p.description)}</p><div class="line"></div><div class="sm muted">شناسه محصول: ${esc(p.sku)}</div><div style="margin:25px 0">${p.comparePrice>p.price?`<span class="old">${money(p.comparePrice)}</span>`:''}<div class="price" style="font-size:25px">${money(p.price)}</div><p class="sm muted">${p.stock?'موجود در انبار':'ناموجود'}</p></div><button class="btn" ${p.stock?'':'disabled'} onclick="addCart('${esc(p.id)}')">افزودن به سبد خرید +</button><div class="line"></div><h3>مشخصات محصول</h3><p>${esc(p.specs||'اطلاعات تکمیلی ثبت نشده')}</p></div></div>${p.video?`<div class="section"><h2>ویدیوی بررسی محصول</h2><div class="review-video"><video controls preload="metadata" style="max-width:640px" src="${safeSrc(p.video)}"></video><p class="xs muted">ویدیو توسط مدیر فروشگاه تعریف می‌شود.</p></div></div>`:''}<div class="section"><h2>محصولات دیگر</h2><div class="products">${visibleProducts().filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></div></main>`}
function addCart(id){let p=prodBy(id);if(!p||p.stock<1)return toast('موجودی کافی نیست');let item=state.cart.find(i=>i.id===id);let count=item?.qty||0;if(count>=p.stock)return toast('بیشتر از موجودی انبار امکان‌پذیر نیست');if(item)item.qty++;else state.cart.push({id,qty:1});save();render();toast('محصول به سبد اضافه شد')}
function qty(id,dir){let item=state.cart.find(i=>i.id===id);if(!item)return;let p=prodBy(id);item.qty=Math.max(0,Math.min(p?.stock||0,item.qty+dir));state.cart=state.cart.filter(i=>i.qty>0);save();render()}
function cartTotal(){return state.cart.reduce((s,item)=>s+(prodBy(item.id)?.price||0)*item.qty,0)}
function shipping(){return cartTotal()>=Number(state.settings.freeShipping)?0:Number(state.settings.shipping)||0}

function checkout(){if(!state.cart.length)return cartPage();let c=state.customer;return `<main class="container"><div class="page-head"><h1>اطلاعات دریافت سفارش</h1><p>تکمیل مشخصات برای ثبت سفارش نمونه</p></div><div class="twocol"><form class="card" onsubmit="placeOrder(event)"><h3>مشخصات مشتری و آدرس</h3><div class="line"></div><div class="formgrid"><div class="field"><label>نام و نام خانوادگی</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>شماره موبایل</label><input name="phone" required pattern="[0-9۰-۹٠-٩+ -]{10,16}" value="${esc(c.phone)}"></div><div class="field"><label>شهر</label><input name="city" required value="${esc(c.city)}"></div><div class="field"><label>نشانی کامل</label><input name="address" required value="${esc(c.address)}"></div></div><div class="mutedbox" style="margin-bottom:18px">شیوه پرداخت در نمونه: <b>شبیه‌سازی پرداخت موفق</b>. به هیچ درگاه بانکی متصل نیست و وجهی دریافت نمی‌شود.</div><button class="btn" type="submit">ثبت سفارش نمایشی</button></form><div class="card" style="height:max-content"><h3>فاکتور سفارش</h3><div class="line"></div>${state.cart.map(i=>`<div class="summaryline"><span class="sm">${esc(prodBy(i.id)?.name)} × ${fa(i.qty)}</span><b class="sm">${money(i.qty*(prodBy(i.id)?.price||0))}</b></div>`).join('')}<div class="line"></div><div class="summaryline"><span>ارسال</span><b>${money(shipping())}</b></div><div class="summaryline bold"><span>قابل پرداخت</span><b>${money(cartTotal()+shipping())}</b></div></div></div></main>`}
function placeOrder(ev){ev.preventDefault();let f=new FormData(ev.target);let c={name:f.get('name').trim(),phone:f.get('phone').trim(),city:f.get('city').trim(),address:f.get('address').trim()};if(!c.name||!c.phone||!c.city||!c.address)return toast('اطلاعات را تکمیل کنید');if(state.cart.some(i=>i.qty>(prodBy(i.id)?.stock||0)))return toast('موجودی برخی کالاها تغییر کرده');let id='MY-'+String(Date.now()).slice(-9);let total=cartTotal()+shipping();let order={id,items:state.cart.map(i=>({...i,name:prodBy(i.id)?.name,price:prodBy(i.id)?.price})),customer:c,total,deliveryCost:shipping(),status:'paid',paymentStatus:'paid-demo',carrier:'',tracking:'',note:'',createdAt:new Date().toLocaleString('fa-IR'),events:[{status:'paid',at:new Date().toLocaleString('fa-IR'),note:'پرداخت شبیه‌سازی شده'}]};state.cart.forEach(i=>{let p=prodBy(i.id);if(p)p.stock-=i.qty});state.orders.unshift(order);state.customer=c;state.cart=[];log('ثبت سفارش '+id);save();go('order:'+id);toast('سفارش نمونه ثبت شد')}
const orderLabels={pending:'در انتظار پرداخت',paid:'ثبت و تأیید شده',preparing:'در حال آماده‌سازی',shipped:'تحویل به حمل‌ونقل',delivered:'تحویل مشتری',cancelled:'لغوشده',refunded:'مستردشده'};

function orderView(id){let o=state.orders.find(x=>x.id===id);if(!o)return `<div class="container empty">سفارشی پیدا نشد.</div>`;let stage=orderStages.indexOf(o.status);return `<main class="container"><div class="page-head"><h1>پیگیری سفارش ${esc(o.id)}</h1><p>ثبت‌شده در ${esc(o.createdAt)}</p></div><div class="twocol"><div><div class="card"><div class="between"><h3>وضعیت: ${esc(orderLabels[o.status])}</h3><span class="pill ${o.status==='delivered'?'good':o.status==='cancelled'?'bad':''}">${esc(o.status==='cancelled'?'لغو':o.status==='refunded'?'بازپرداخت':'فرآیند سفارش')}</span></div>${stage>=0?`<div class="timeline">${orderStages.map((s,i)=>`<div class="step ${i<=stage?'done':''}"><i>${i<=stage?'✓':''}</i>${esc(orderLabels[s])}</div>`).join('')}</div>`:`<p class="muted">وضعیت سفارش: ${esc(orderLabels[o.status])}</p>`}<div class="line"></div><p><b>حمل‌ونقل:</b> ${esc(o.carrier||'هنوز تعیین نشده')}</p><p><b>کد رهگیری مرسوله:</b> ${esc(o.tracking||'پس از ارسال ثبت می‌شود')}</p><div class="line"></div><h3>تاریخچه مراحل</h3>${o.events.map(e=>`<p class="sm">• ${esc(orderLabels[e.status]||e.status)} — ${esc(e.at)} ${esc(e.note||'')}</p>`).join('')}</div><div class="card" style="margin-top:15px"><h3>کالاهای سفارش</h3>${o.items.map(i=>`<div class="summaryline"><span>${esc(i.name)} × ${fa(i.qty)}</span><b>${money(i.price*i.qty)}</b></div>`).join('')}</div></div><div class="card" style="height:max-content"><h3>مشخصات تحویل</h3><div class="line"></div><p>${esc(o.customer.name)}</p><p class="muted">${esc(o.customer.phone)}</p><p class="muted">${esc(o.customer.city)}، ${esc(o.customer.address)}</p><div class="line"></div><div class="summaryline"><span>جمع سفارش</span><b>${money(o.total)}</b></div><p class="xs muted">پرداخت: آزمایشی</p><button class="btn secondary" style="width:100%;margin-top:15px" onclick="go('orders')">همه سفارش‌های من</button></div></div></main>`}
function ordersPage(){let myOrders=state.orders.filter(o=>!state.customer.phone||o.customer.phone===state.customer.phone);return `<main class="container"><div class="page-head"><h1>سفارش‌های من</h1><p>سوابق خرید و وضعیت ارسال هر سفارش</p></div><div class="card" style="margin-bottom:18px"><div class="row"><input class="search" placeholder="شماره سفارش را وارد کنید" style="max-width:350px" value="${esc(trackSearch)}" oninput="trackSearch=this.value"><button class="btn secondary" onclick="if(state.orders.find(o=>o.id===trackSearch&&o.customer.phone===state.customer.phone))go('order:'+trackSearch);else toast('این سفارش با حساب شما مطابقت ندارد')">پیگیری</button></div></div>${myOrders.length?myOrders.map(o=>`<div class="card" style="margin-bottom:12px"><div class="between"><div><h3>${esc(o.id)}</h3><p class="sm muted">${esc(o.createdAt)}</p><p>${fa(o.items.length)} قلم • ${money(o.total)}</p></div><div><div class="pill">${esc(orderLabels[o.status])}</div><div style="margin-top:10px"><button class="btn sm secondary" onclick="go('order:${esc(o.id)}')">جزئیات و رهگیری</button></div></div></div></div>`).join(''):'<div class="empty"><span>📦</span>هنوز سفارشی ثبت نکرده‌اید.</div>'}</main>`}

function adminOverview(){let sales=state.orders.filter(o=>!['cancelled','refunded'].includes(o.status)).reduce((a,o)=>a+o.total,0);return `<div class="section-head"><h2>نمای کلی</h2><button class="btn sm secondary" onclick="go('home')">دیدن فروشگاه</button></div><div class="statgrid"><div class="stat"><span class="muted">محصولات</span><b>${fa(state.products.length)}</b></div><div class="stat"><span class="muted">دسته‌ها</span><b>${fa(state.categories.length)}</b></div><div class="stat"><span class="muted">سفارش‌ها</span><b>${fa(state.orders.length)}</b></div><div class="stat"><span class="muted">فروش نمایشی</span><b style="font-size:17px">${money(sales)}</b></div></div><div class="card" style="margin-top:22px"><h3>فعالیت‌های اخیر</h3><div class="line"></div>${state.logs.length?state.logs.slice(0,8).map(l=>`<p class="sm">• ${esc(l.event)} <span class="muted">${esc(l.at)}</span></p>`).join(''):'<p class="muted">هنوز فعالیتی ثبت نشده است.</p>'}</div><div class="card" style="margin-top:15px"><h3>عملیات سریع</h3><div class="row" style="margin-top:15px"><button class="btn" onclick="admin('builder')">ویرایش لندینگ</button><button class="btn secondary" onclick="admin('products');newProduct()">افزودن محصول</button><button class="btn secondary" onclick="admin('orders')">مدیریت سفارش</button></div></div>`}
const typeLabels={hero:'بنر اصلی Hero',categories:'دسته‌بندی تصویری',products:'ردیف محصولات',banner:'بنر تبلیغاتی',video:'ویدیوی معرفی',trust:'اعتمادسازی و مزایا'};
function adminBuilder(){let blocks=state.draftBlocks;let b=blocks.find(x=>x.id===selectedBlock)||blocks[0];if(!selectedBlock&&b)selectedBlock=b.id;return `<div class="section-head"><div><h2>صفحه‌ساز اصلی</h2><p class="sm muted">افزودن، ترتیب، محتوا، تصویر و انتشار</p></div><div class="row"><button class="btn secondary sm" onclick="previewDraft=true;go('home')">پیش‌نمایش پیش‌نویس</button><button class="btn sm" onclick="publishBlocks()">انتشار صفحه اصلی</button></div></div><div class="builder"><div><div class="card"><h3>سکشن‌های صفحه</h3><div class="line"></div><div class="blocklist">${blocks.map((x,i)=>`<div class="blockitem ${b?.id===x.id?'selected':''}" onclick="selectedBlock='${esc(x.id)}';render()"><div class="between"><b class="sm">${fa(i+1)}. ${esc(typeLabels[x.type])}</b><span class="pill ${x.visible?'good':'bad'}">${x.visible?'فعال':'مخفی'}</span></div><p class="xs muted">${esc(x.title||'بدون عنوان')}</p><div class="sm"><button class="btn sm secondary" onclick="event.stopPropagation();moveBlock('${esc(x.id)}',-1)">↑</button><button class="btn sm secondary" onclick="event.stopPropagation();moveBlock('${esc(x.id)}',1)">↓</button><button class="btn sm secondary" onclick="event.stopPropagation();toggleBlock('${esc(x.id)}')">${x.visible?'مخفی':'نمایش'}</button><button class="btn sm danger" onclick="event.stopPropagation();removeBlock('${esc(x.id)}')">حذف</button></div></div>`).join('')}</div><div class="line"></div><div class="field"><label>افزودن سکشن جدید</label><select id="new-block-type">${Object.keys(typeLabels).map(k=>`<option value="${k}">${typeLabels[k]}</option>`).join('')}</select></div><button class="btn" style="width:100%" onclick="addBlock(document.getElementById('new-block-type').value)">+ افزودن سکشن</button></div></div><div>${b?`<div class="card"><h3>ویرایش: ${esc(typeLabels[b.type])}</h3><p class="sm muted">تغییرات در پیش‌نویس ذخیره می‌شوند؛ برای نمایش عمومی «انتشار» را بزنید.</p><div class="line"></div><form onsubmit="saveBlock(event,'${esc(b.id)}')"><div class="formgrid"><div class="field"><label>عنوان</label><input name="title" value="${esc(b.title)}"></div><div class="field"><label>توضیح</label><input name="subtitle" value="${esc(b.subtitle)}"></div>${b.type==='hero'?`<div class="field"><label>برچسب بالای عنوان</label><input name="eyebrow" value="${esc(b.eyebrow||'')}"></div><div class="field"><label>عنوان ستون کناری هرو</label><input name="sideTitle" value="${esc(b.sideTitle||'')}"></div><div class="field"><label>کالای اول در ستون Hero</label><select name="sideProduct1"><option value="">انتخاب خودکار</option>${state.products.map(p=>`<option value="${esc(p.id)}" ${b.sideProduct1===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>کالای دوم در ستون Hero</label><select name="sideProduct2"><option value="">انتخاب خودکار</option>${state.products.map(p=>`<option value="${esc(p.id)}" ${b.sideProduct2===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`:''}${['hero','banner'].includes(b.type)?`<div class="field"><label>متن دکمه</label><input name="button" value="${esc(b.button||'')}"></div><div class="field"><label>آدرس تصویر (URL)</label><input name="image" value="${esc(b.image||'')}"></div>${mediaSelect('image','image')}`:''}${b.type==='products'?`<div class="field"><label>دسته محصولات</label><select name="category"><option value="all">همه محصولات</option>${state.categories.map(c=>`<option ${b.category===c.id?'selected':''} value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>تعداد محصولات</label><input name="count" type="number" min="1" max="16" value="${b.count||4}"></div>`:''}${b.type==='video'?`<div class="field"><label>لینک مستقیم فایل ویدیو (MP4/WebM)</label><input name="video" value="${esc(b.video||'')}"></div>${mediaSelect('video','video')}`:''}</div><button type="submit" class="btn">ذخیره پیش‌نویس</button></form></div><div class="card" style="margin-top:14px"><h3>نمای کوچک بلوک منتخب</h3><div class="previewbox" style="margin-top:12px">${b.type==='hero'?`<div class="previewhero"><b>${esc(b.title)}</b><p class="sm">${esc(b.subtitle)}</p></div>`:b.type==='products'?`<p>${esc(b.title)} · ${fa(b.count||4)} محصول</p><div class="previewcards"><div>📦 کالا</div><div>🧴 کالا</div><div>🧸 کالا</div></div>`:`<div class="previewhero"><b>${esc(b.title)}</b><p class="sm">${esc(b.subtitle)}</p></div>`}</div></div>`:'<div class="empty">سکشنی انتخاب کنید یا سکشن جدید اضافه کنید.</div>'}</div></div>`}
function mediaSelect(field,kind='image'){
 let list=state.media.filter(x=>x.type===kind);
 return `<div class="field"><label>انتخاب از کتابخانه رسانه</label><select onchange="if(this.value)this.closest('form').querySelector('[name=${field}]').value=this.value"><option value="">انتخاب رسانه ذخیره‌شده...</option>${list.map(m=>`<option value="${esc(m.url)}">${esc(m.title)}</option>`).join('')}</select></div><div class="field"><label>یا آپلود فایل از دستگاه (نمونه محلی)</label><input type="file" accept="${kind==='video'?'video/mp4,video/webm':'image/*'}" onchange="uploadToField(event,'${field}','${kind}')"><small class="muted">${kind==='video'?'در دمو فقط فایل کوچک قابل ذخیره است؛ در تولید روی فضای رسانه ذخیره می‌شود.':'تصویر در مرورگر کم‌حجم و ذخیره می‌شود.'}</small></div>`
}
function uploadToField(ev,field,kind){let file=ev.target.files?.[0];if(!file)return;
 let input=ev.target.closest('form')?.querySelector(`[name="${field}"]`);if(!input)return;
 if(kind==='video'){if(!['video/mp4','video/webm'].includes(file.type)||file.size>950000)return toast('در نمونه ویدیو باید MP4/WebM و کمتر از ۹۵۰ کیلوبایت باشد؛ برای ویدیوی اصلی لینک وارد کنید.');let reader=new FileReader();reader.onload=()=>{input.value=reader.result;toast('ویدیو بارگذاری شد؛ فرم را ذخیره کنید')};reader.readAsDataURL(file);return}
 if(!file.type.startsWith('image/'))return toast('فایل باید تصویر باشد');let reader=new FileReader();reader.onload=()=>{let picture=new Image();picture.onload=()=>{let ratio=Math.min(1,1000/Math.max(picture.width,picture.height)),canvas=document.createElement('canvas');canvas.width=Math.round(picture.width*ratio);canvas.height=Math.round(picture.height*ratio);canvas.getContext('2d').drawImage(picture,0,0,canvas.width,canvas.height);input.value=canvas.toDataURL('image/jpeg',.77);toast('تصویر آماده شد؛ فرم را ذخیره کنید')};picture.src=reader.result};reader.readAsDataURL(file)
}
function saveBlock(e,id){e.preventDefault();let b=state.draftBlocks.find(x=>x.id===id);if(!b)return;let data=Object.fromEntries(new FormData(e.target).entries());Object.assign(b,data);if(data.count)b.count=Number(data.count);log('ویرایش سکشن '+b.type);save();render();toast('پیش‌نویس ذخیره شد')}
function moveBlock(id,dir){let i=state.draftBlocks.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=state.draftBlocks.length)return;[state.draftBlocks[i],state.draftBlocks[j]]=[state.draftBlocks[j],state.draftBlocks[i]];save();render()}
function toggleBlock(id){let b=state.draftBlocks.find(x=>x.id===id);if(b)b.visible=!b.visible;save();render()}
function removeBlock(id){if(!confirm('این سکشن از پیش‌نویس حذف شود؟'))return;state.draftBlocks=state.draftBlocks.filter(x=>x.id!==id);selectedBlock=state.draftBlocks[0]?.id;save();render()}
function addBlock(type){let b={id:'b'+Date.now(),type,title:typeLabels[type],subtitle:'متن توضیح این سکشن را از پنل مدیریت ویرایش کنید.',visible:true,category:'all',count:4,button:'مشاهده بیشتر',image:'',video:'',eyebrow:'مایکا'};state.draftBlocks.push(b);selectedBlock=b.id;save();render();toast('سکشن ایجاد شد')}
function publishBlocks(){state.publishedBlocks=JSON.parse(JSON.stringify(state.draftBlocks));state.publishedAt=new Date().toLocaleString('fa-IR');log('انتشار نسخه جدید صفحه اصلی');save();render();toast('نسخه جدید صفحه اصلی منتشر شد')}
function adminProducts(){return `<div class="section-head"><div><h2>محصولات</h2><p class="sm muted">قیمت، ویژگی‌ها، رسانه، موجودی و نمایش</p></div><button class="btn sm" onclick="newProduct()">+ محصول جدید</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>کالا</th><th>دسته</th><th>قیمت</th><th>موجودی</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${state.products.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="xs muted">${esc(p.sku)}</div></td><td>${esc(catName(p.category))}</td><td>${money(p.price)}</td><td>${fa(p.stock)}</td><td><span class="pill ${p.published?'good':'bad'}">${p.published?'منتشر':'غیرفعال'}</span></td><td><button class="btn sm secondary" onclick="editProduct('${esc(p.id)}')">ویرایش</button><button class="btn sm danger" onclick="deleteProduct('${esc(p.id)}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function newProduct(){editor={type:'product',id:null};render()}
function editProduct(id){editor={type:'product',id};render()}
function deleteProduct(id){if(state.orders.some(o=>o.items.some(i=>i.id===id)))return toast('کالای دارای سابقه سفارش باید غیرفعال شود؛ حذف مجاز نیست');if(!confirm('محصول حذف شود؟'))return;state.products=state.products.filter(p=>p.id!==id);save();render()}
function adminCategories(){return `<div class="section-head"><div><h2>دسته‌بندی‌ها</h2><p class="sm muted">سلسله‌مراتب، تصویر، توضیح و ترتیب</p></div><button class="btn sm" onclick="editor={type:'category',id:null};render()">+ دسته جدید</button></div><div class="card tablewrap"><table class="table"><thead><tr><th>نام</th><th>والد</th><th>شناسه URL</th><th>ترتیب</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${state.categories.sort((a,b)=>a.order-b.order).map(c=>`<tr><td>${esc(c.emoji||'📁')} <b>${esc(c.name)}</b></td><td>${esc(catName(c.parent)||'—')}</td><td>${esc(c.slug)}</td><td>${fa(c.order)}</td><td>${c.active?'فعال':'غیرفعال'}</td><td><button class="btn sm secondary" onclick="editor={type:'category',id:'${esc(c.id)}'};render()">ویرایش</button><button class="btn sm danger" onclick="deleteCategory('${esc(c.id)}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function deleteCategory(id){if(state.products.some(p=>p.category===id)||state.categories.some(c=>c.parent===id))return toast('ابتدا کالاها و زیردسته‌ها را منتقل کنید');if(!confirm('دسته حذف شود؟'))return;state.categories=state.categories.filter(c=>c.id!==id);save();render()}
function adminMedia(){return `<div class="section-head"><div><h2>کتابخانه رسانه</h2><p class="sm muted">مدیریت تصاویر، پوسترها و ویدیوهای بررسی</p></div><button class="btn sm" onclick="editor={type:'media',id:null};render()">+ رسانه جدید</button></div><div class="card"><p class="muted sm">برای نمونه می‌توانید آدرس تصویر یا ویدیوی مستقیم اضافه کنید. در تولید اصلی، آپلود فایل، برش تصویر، تبدیل کیفیت، CDN و دسترسی امن به فایل انجام می‌شود.</p><div class="uploaded-grid" style="margin-top:18px">${state.media.map(m=>`<div class="upload"><div style="height:100px;display:grid;place-items:center;background:var(--surface);border-radius:10px;margin-bottom:10px;overflow:hidden">${m.type==='video'?'🎬':safeSrc(m.url)?`<img src="${safeSrc(m.url)}" style="height:100%;max-width:100%;object-fit:contain">`:'🖼️'}</div><b class="sm">${esc(m.title)}</b><p class="xs muted">${esc(m.type)}</p><div class="row" style="margin-top:8px"><button class="btn sm secondary" onclick="editor={type:'media',id:'${esc(m.id)}'};render()">ویرایش</button><button class="btn sm danger" onclick="state.media=state.media.filter(x=>x.id!=='${esc(m.id)}');save();render()">حذف</button></div></div>`).join('')||'<div class="muted">رسانه مستقلی اضافه نشده است.</div>'}</div></div>`}
function adminOrders(){return `<div class="section-head"><div><h2>سفارش‌ها</h2><p class="sm muted">تکمیل سفارش و درج اطلاعات ارسال</p></div></div><div class="card tablewrap"><table class="table"><thead><tr><th>شماره</th><th>مشتری</th><th>تاریخ</th><th>مبلغ</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.customer.name)}<br><small>${esc(o.customer.phone)}</small></td><td>${esc(o.createdAt)}</td><td>${money(o.total)}</td><td>${esc(orderLabels[o.status])}</td><td><button class="btn sm secondary" onclick="editor={type:'order',id:'${esc(o.id)}'};render()">پردازش</button></td></tr>`).join('')||'<tr><td colspan="6">هنوز سفارشی ثبت نشده است. برای آزمایش از فروشگاه خرید کنید.</td></tr>'}</tbody></table></div>`}
function adminSettings(){let s=state.settings;return `<div class="section-head"><h2>تنظیمات فروشگاه</h2></div><form class="card" onsubmit="saveSettings(event)"><div class="formgrid">${[['name','نام فروشگاه','text'],['support','شماره پشتیبانی','text'],['shipping','هزینه پایه ارسال (تومان)','number'],['freeShipping','حداقل سبد برای ارسال رایگان (تومان)','number'],['footer','متن فوتر','text'],['notice','پیام اطلاع‌رسانی','text']].map(([k,t,type])=>`<div class="field"><label>${t}</label><input name="${k}" type="${type}" value="${esc(s[k])}"></div>`).join('')}</div><button class="btn" type="submit">ذخیره تنظیمات</button></form><div class="card" style="margin-top:14px"><h3>پشتیبان‌گیری از داده‌های نمونه</h3><div class="row" style="margin-top:14px"><button class="btn secondary" onclick="exportData()">خروجی JSON</button><label class="btn secondary" style="cursor:pointer">واردکردن JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importData(event)"></label><button class="btn danger" onclick="resetDemo()">بازنشانی اطلاعات نمایشی</button></div></div>`}
function saveSettings(e){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());data.shipping=Number(data.shipping);data.freeShipping=Number(data.freeShipping);state.settings=data;save();render();toast('تنظیمات ذخیره شد')}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='myca-shop-demo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!Array.isArray(data.products)||!Array.isArray(data.categories)||!Array.isArray(data.draftBlocks))throw Error('invalid');if(!confirm('داده‌های فعلی با فایل پشتیبان جایگزین شود؟'))return;state=data;save();render();toast('پشتیبان بازیابی شد')}catch(err){toast('فایل پشتیبان معتبر نیست')}};r.readAsText(f)}
function resetDemo(){if(!confirm('تمام تغییرات و سفارش‌های نمایشی حذف شوند؟'))return;state=initial();previewDraft=false;selectedBlock=null;save();render();toast('نمونه بازنشانی شد')}
function overlay(){if(!editor)return '';let kind=editor.type;
 if(kind==='product'){let p=editor.id?prodBy(editor.id):{name:'',slug:'',sku:'',category:state.categories[0]?.id||'',price:0,comparePrice:0,stock:0,emoji:'📦',image:'',gallery:'',video:'',description:'',specs:'',published:true,featured:false};return `<div class="modalshade" onclick="if(event.target===this){editor=null;render()}"><div class="modal"><div class="between"><h2>${editor.id?'ویرایش محصول':'محصول جدید'}</h2><button class="btn secondary sm" onclick="editor=null;render()">بستن ×</button></div><div class="line"></div><form onsubmit="saveProduct(event)"><div class="formgrid">${[['name','نام کالا','text'],['slug','نامک URL','text'],['sku','کد SKU','text']].map(([k,label,type])=>`<div class="field"><label>${label}</label><input name="${k}" type="${type}" required value="${esc(p[k])}"></div>`).join('')}<div class="field"><label>دسته</label><select name="category">${state.categories.map(c=>`<option value="${esc(c.id)}" ${p.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${[['price','قیمت فروش (تومان)'],['comparePrice','قیمت قبل از تخفیف'],['stock','موجودی']].map(([k,label])=>`<div class="field"><label>${label}</label><input type="number" min="0" name="${k}" value="${esc(p[k])}"></div>`).join('')}<div class="field"><label>نماد جایگزین تصویر</label><input name="emoji" value="${esc(p.emoji)}"></div><div class="field"><label>URL تصویر اصلی</label><input name="image" value="${esc(p.image)}"></div>${mediaSelect('image','image')}<div class="field"><label>گالری تصاویر (URLها با ویرگول)</label><input name="gallery" value="${esc(p.gallery)}"></div><div class="field"><label>ویدیوی بررسی (URL مستقیم MP4)</label><input name="video" value="${esc(p.video)}"></div>${mediaSelect('video','video')}<div class="field"><label>توضیحات کالا</label><textarea name="description">${esc(p.description)}</textarea></div><div class="field"><label>مشخصات فنی (متن)</label><textarea name="specs">${esc(p.specs)}</textarea></div><div class="field"><label><input type="checkbox" name="published" ${p.published?'checked':''}> نمایش در فروشگاه</label></div><div class="field"><label><input type="checkbox" name="featured" ${p.featured?'checked':''}> محصول منتخب</label></div></div><button class="btn" type="submit">ذخیره محصول</button></form></div></div>`}
 if(kind==='category'){let c=editor.id?catBy(editor.id):{name:'',slug:'',parent:'',emoji:'📁',image:'',description:'',active:true,order:state.categories.length+1};return `<div class="modalshade" onclick="if(event.target===this){editor=null;render()}"><div class="modal"><div class="between"><h2>${editor.id?'ویرایش دسته':'دسته جدید'}</h2><button class="btn secondary sm" onclick="editor=null;render()">بستن ×</button></div><div class="line"></div><form onsubmit="saveCategory(event)"><div class="formgrid"><div class="field"><label>نام دسته</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>شناسه URL</label><input name="slug" required value="${esc(c.slug)}"></div><div class="field"><label>دسته والد</label><select name="parent"><option value="">دسته اصلی</option>${state.categories.filter(x=>x.id!==editor.id).map(x=>`<option value="${esc(x.id)}" ${c.parent===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>ترتیب نمایش</label><input name="order" type="number" value="${esc(c.order)}"></div><div class="field"><label>نماد</label><input name="emoji" value="${esc(c.emoji)}"></div><div class="field"><label>URL تصویر دسته</label><input name="image" value="${esc(c.image)}"></div>${mediaSelect('image','image')}<div class="field"><label>توضیح دسته</label><textarea name="description">${esc(c.description)}</textarea></div><div class="field"><label><input type="checkbox" name="active" ${c.active?'checked':''}> نمایش دسته</label></div></div><button class="btn">ذخیره دسته</button></form></div></div>`}

function saveProduct(e){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());['price','comparePrice','stock'].forEach(k=>data[k]=Math.max(0,Number(data[k])||0));data.published=!!data.published;data.featured=!!data.featured;let dup=state.products.find(p=>p.slug===data.slug&&p.id!==editor.id);if(dup)return toast('نامک URL تکراری است');if(editor.id)Object.assign(prodBy(editor.id),data);else{data.id='p'+Date.now();state.products.push(data)}log('ذخیره کالا '+data.name);editor=null;save();render();toast('محصول ذخیره شد')}
function saveCategory(e){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());data.order=Number(data.order)||0;data.active=!!data.active;if(state.categories.some(c=>c.slug===data.slug&&c.id!==editor.id))return toast('نامک تکراری است');if(editor.id){let cur=data.parent,n=0;while(cur&&n++<30){if(cur===editor.id)return toast('دسته نمی‌تواند زیرمجموعه خودش باشد');cur=catBy(cur)?.parent}Object.assign(catBy(editor.id),data)}else{data.id='c'+Date.now();state.categories.push(data)}log('ذخیره دسته '+data.name);editor=null;save();render();toast('دسته ذخیره شد')}
function saveMedia(e){e.preventDefault();let data=Object.fromEntries(new FormData(e.target).entries());if(editor.id)Object.assign(state.media.find(m=>m.id===editor.id),data);else{data.id='m'+Date.now();state.media.push(data)}editor=null;save();render();toast('رسانه ذخیره شد')}
function saveOrder(e){e.preventDefault();let o=state.orders.find(x=>x.id===editor.id);let d=Object.fromEntries(new FormData(e.target).entries());if(o.status!==d.status)o.events.push({status:d.status,at:new Date().toLocaleString('fa-IR'),note:d.note||''});Object.assign(o,d);log('تغییر سفارش '+o.id+' به '+orderLabels[o.status]);editor=null;save();render();toast('سفارش به‌روزرسانی شد')}
