name: MYCA Shop Commerce Platform Static Tests
on:
  push:
    branches:
      - 'feat/commerce-platform-*'
  pull_request:
    paths:
      - 'api/**'
      - 'app/**'
      - 'assets/**'
      - 'db/**'
      - 'admin/**'
      - 'product/**'
      - 'account/**'
      - 'tests/**'
      - 'index.html'
      - 'index.php'
      - '.github/workflows/commerce-platform.yml'
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@4d9af88f47c19dfd7686a3edcbfe086f0b97b3a9 # v2.35.2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: PHP/JS/structure tests
        run: bash tests/commerce-static-check.sh
